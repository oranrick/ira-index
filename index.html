<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IRA — Índice de Resonancia Afectiva</title>
    <meta name="description" content="Medición del lenguaje empático y polarizador en políticos, medios y países." />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #08080c; }
      #root { position: relative; z-index: 1; }

      /* ── Mesh gradient animado ── */
      #bg-mesh {
        position: fixed; inset: 0;
        z-index: 0; pointer-events: none; overflow: hidden;
      }
      .blob {
        position: absolute; border-radius: 50%;
        will-change: transform;
      }
      .blob1 {
        top: -18%; left: 28%;
        width: 760px; height: 580px;
        background: radial-gradient(ellipse, rgba(255,102,0,0.09) 0%, transparent 68%);
        filter: blur(80px);
        animation: blob1 28s ease-in-out infinite;
      }
      .blob2 {
        bottom: -20%; right: -6%;
        width: 580px; height: 460px;
        background: radial-gradient(ellipse, rgba(200,60,0,0.07) 0%, transparent 70%);
        filter: blur(70px);
        animation: blob2 35s ease-in-out infinite;
      }
      .blob3 {
        top: 20%; left: -14%;
        width: 460px; height: 400px;
        background: radial-gradient(ellipse, rgba(255,85,0,0.055) 0%, transparent 72%);
        filter: blur(65px);
        animation: blob3 22s ease-in-out infinite;
      }

      @keyframes blob1 {
        0%   { transform: translate(0, 0)      scale(1); }
        25%  { transform: translate(40px, -28px) scale(1.04); }
        50%  { transform: translate(-30px, 22px) scale(0.97); }
        75%  { transform: translate(20px, -14px) scale(1.02); }
        100% { transform: translate(0, 0)      scale(1); }
      }
      @keyframes blob2 {
        0%   { transform: translate(0, 0)         scale(1); }
        30%  { transform: translate(-38px, -24px)  scale(1.06); }
        60%  { transform: translate(20px, 34px)    scale(0.93); }
        100% { transform: translate(0, 0)         scale(1); }
      }
      @keyframes blob3 {
        0%   { transform: translate(0, 0)        scale(1); }
        40%  { transform: translate(28px, 42px)  scale(1.07); }
        70%  { transform: translate(-18px, 14px) scale(0.96); }
        100% { transform: translate(0, 0)        scale(1); }
      }
      @keyframes slideUp {
        from { opacity: 0; transform: translateY(12px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="bg-mesh" aria-hidden="true">
      <div class="blob blob1"></div>
      <div class="blob blob2"></div>
      <div class="blob blob3"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
