<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IRA — Índice de Resonancia Afectiva</title>
    <meta name="description" content="Medición del lenguaje empático y polarizador en políticos, medios y países." />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #08080c; }
      @keyframes slideUp {
        from { opacity: 0; transform: translateY(12px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @keyframes blob1 {
        0%   { transform: translate(-50%, 0)    scale(1); }
        25%  { transform: translate(-46%, -28px) scale(1.04); }
        50%  { transform: translate(-54%, 18px)  scale(0.97); }
        75%  { transform: translate(-48%, -12px) scale(1.02); }
        100% { transform: translate(-50%, 0)    scale(1); }
      }
      @keyframes blob2 {
        0%   { transform: translate(0, 0)        scale(1); }
        30%  { transform: translate(-35px, -22px) scale(1.06); }
        60%  { transform: translate(18px, 32px)  scale(0.93); }
        100% { transform: translate(0, 0)        scale(1); }
      }
      @keyframes blob3 {
        0%   { transform: translate(0, 0)       scale(1); }
        40%  { transform: translate(25px, 38px) scale(1.07); }
        70%  { transform: translate(-15px, 12px) scale(0.96); }
        100% { transform: translate(0, 0)       scale(1); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
